<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>/*__TITLE__*/</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a framed three-pane git client: branch tree | virtualized commit graph + year rail | commit inspector */
:root {
  --bg: #E9ECF0;
  --panel: #FFFFFF;
  --side: #F5F6F8;
  --line: #DCE0E6;
  --line-soft: #EDEFF2;
  --fg: #151C26;
  --muted: #536071;
  --faint: #8790A0;
  --accent: #C2410C;
  --accent-ink: #FFFFFF;
  --sel: #FCEEE6;
  --hover: #F4F6F9;
  --mark: #FFF0B3;
  --mark-tick: #D49A00;
  --band: #F1F3F6;
  --shadow: 0 10px 30px rgba(20, 28, 40, .16);
  --l0: #2563EB; --l1: #15803D; --l2: #DB2777; --l3: #0D9488;
  --l4: #7C3AED; --l5: #B45309; --l6: #DC2626; --l7: #4D7C0F;
  --font-ui: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --row: 26px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0F13; --panel: #141920; --side: #11151B; --line: #262D37; --line-soft: #1C222A;
    --fg: #E3E7ED; --muted: #9AA4B3; --faint: #6A7483;
    --accent: #FF8A3D; --accent-ink: #1A0E05; --sel: #2A1E16; --hover: #19202A;
    --mark: #3D3413; --mark-tick: #F2C14E; --band: #171D25; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
    --l0: #6EA8FE; --l1: #4ADE80; --l2: #F472B6; --l3: #2DD4BF;
    --l4: #A78BFA; --l5: #FBBF24; --l6: #F87171; --l7: #A3E635;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0F13; --panel: #141920; --side: #11151B; --line: #262D37; --line-soft: #1C222A;
  --fg: #E3E7ED; --muted: #9AA4B3; --faint: #6A7483;
  --accent: #FF8A3D; --accent-ink: #1A0E05; --sel: #2A1E16; --hover: #19202A;
  --mark: #3D3413; --mark-tick: #F2C14E; --band: #171D25; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --l0: #6EA8FE; --l1: #4ADE80; --l2: #F472B6; --l3: #2DD4BF;
  --l4: #A78BFA; --l5: #FBBF24; --l6: #F87171; --l7: #A3E635;
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 13px; line-height: 1.4;
  overflow: hidden;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); padding-inline: 16px; padding-block: 0 16px; gap: 0; }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; padding-block: 12px; }
.repo { display: flex; align-items: baseline; gap: 10px; min-width: 0; flex-wrap: wrap; }
.repo h1 {
  margin: 0; font-size: 19px; font-weight: 650; font-stretch: 82%; letter-spacing: -.01em;
  text-wrap: balance;
}
.repo h1 span { color: var(--faint); font-weight: 500; }
.stats { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 12px; }
.stats b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-left: auto; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); padding: 2px; }
.seg button { border: 0; background: none; padding: 3px 10px; border-radius: 5px; color: var(--muted); font-size: 12px; font-weight: 550; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
.toggle { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 4px 10px; font-size: 12px; color: var(--muted); font-weight: 550; }
.toggle[aria-pressed="true"] { color: var(--fg); border-color: var(--faint); }
.toggle .dot { width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.toggle[aria-pressed="true"] .dot { background: var(--accent); border-color: var(--accent); }
.iso-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--accent-ink); border-radius: 7px; padding: 4px 6px 4px 10px; font-size: 12px; font-weight: 600; max-width: 280px; }
.iso-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iso-chip button { border: 0; background: rgba(0,0,0,.15); color: inherit; border-radius: 4px; width: 18px; height: 18px; line-height: 1; padding: 0; }

.search { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 2px 4px 2px 8px; }
.search:focus-within { border-color: var(--accent); }
.search svg { flex: none; color: var(--faint); }
.search input { border: 0; outline: 0; background: none; width: 200px; padding: 3px 2px; font-size: 12.5px; }
.search .count { font-size: 11px; color: var(--faint); min-width: 54px; text-align: right; white-space: nowrap; }
.icon-btn { border: 0; background: none; width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); padding: 0; }
.icon-btn:hover { background: var(--hover); color: var(--fg); }
.icon-btn:disabled { opacity: .35; cursor: default; background: none; }
.side-toggle { display: none; }

/* ---------- frame ---------- */
.frame {
  position: relative; min-height: 0; display: grid;
  grid-template-columns: 260px minmax(0, 1fr) auto;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
}

/* ---------- sidebar ---------- */
.side { background: var(--side); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
.side-head { padding: 10px 12px 8px; border-bottom: 1px solid var(--line-soft); }
.side-head input { width: 100%; box-sizing: border-box; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 8px; font-size: 12px; outline: 0; }
.side-head input:focus { border-color: var(--accent); }
.tree { overflow: auto; padding: 6px 0 16px; }
.sec { margin-top: 6px; }
.sec-h, .fold-h {
  display: flex; align-items: center; gap: 6px; width: 100%; border: 0; background: none; text-align: left;
  padding: 4px 12px; color: var(--muted);
}
.sec-h { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; }
.sec-h .n, .fold-h .n { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; color: var(--faint); letter-spacing: 0; font-weight: 400; }
.fold-h { font-size: 12px; padding-left: 18px; color: var(--fg); }
.fold-h:hover, .sec-h:hover { color: var(--fg); }
.chev { width: 10px; height: 10px; flex: none; transition: transform .12s; color: var(--faint); }
[aria-expanded="true"] > .chev { transform: rotate(90deg); }
.refrow { display: flex; align-items: center; position: relative; }
.refrow:hover { background: var(--hover); }
.refrow.cur .ref { color: var(--accent); font-weight: 600; }
.ref {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; border: 0; background: none; text-align: left;
  padding: 3px 8px 3px 26px; font-size: 12px; color: var(--fg); height: 24px;
}
.in-fold .ref { padding-left: 40px; }
.ref .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.ref .age { margin-left: auto; font-size: 10.5px; color: var(--faint); font-family: var(--font-mono); flex: none; }
.ref svg { flex: none; color: var(--faint); }
.iso { opacity: 0; border: 0; background: none; color: var(--muted); padding: 0 8px; height: 24px; font-size: 10.5px; font-weight: 600; letter-spacing: .02em; }
.refrow:hover .iso, .iso:focus-visible { opacity: 1; }
.iso:hover { color: var(--accent); }
.more { padding: 4px 26px; color: var(--faint); font-size: 11.5px; }

/* ---------- graph list ---------- */
.graph { display: grid; grid-template-rows: auto minmax(0, 1fr); min-width: 0; min-height: 0; container-type: inline-size; }
.cols {
  display: grid; grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 150px 128px 78px 44px;
  border-bottom: 1px solid var(--line); font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint);
}
.cols > div { padding: 7px 10px; white-space: nowrap; overflow: hidden; }
.cols > div:first-child { padding-left: 12px; }
.list-wrap { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 44px; }
.scroller { overflow-y: auto; overflow-x: hidden; position: relative; outline: 0; scrollbar-width: none; }
.scroller::-webkit-scrollbar { display: none; }
.spacer { position: relative; }
.rows { position: absolute; left: 0; right: 0; top: 0; will-change: transform; }
#lanes { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 2; }
.row {
  height: var(--row); display: grid; grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 150px 128px 78px;
  align-items: center; cursor: default; border-bottom: 1px solid transparent;
}
.row:hover { background: var(--hover); }
.row.hit { background: var(--mark); }
.row.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
.row > div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 10px; min-width: 0; }
.row > .g { padding: 0; }
.desc { display: flex; align-items: center; gap: 5px; }
.subj { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.row.merge .subj { color: var(--muted); }
.tk { font-family: var(--font-mono); font-size: 11px; font-weight: 500; color: var(--fg); }
.row.merge .tk { color: var(--muted); }
.prn { color: var(--faint); }
mark { background: var(--mark-tick); color: #111; border-radius: 2px; padding: 0 1px; }
.au { color: var(--muted); display: flex; align-items: center; gap: 6px; }
.av { flex: none; width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; font-size: 8.5px; font-weight: 700; color: #fff; letter-spacing: 0; }
.au .an { overflow: hidden; text-overflow: ellipsis; }
.dt, .hs { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.hs { color: var(--faint); }

/* ref pills */
.pill {
  flex: none; display: inline-flex; align-items: center; gap: 4px; height: 17px; padding: 0 6px; border-radius: 4px;
  font-size: 11px; font-weight: 600; line-height: 1; border: 1px solid var(--pc, var(--faint)); color: var(--pc, var(--fg));
  background: color-mix(in srgb, var(--pc, var(--faint)) 10%, var(--panel)); max-width: 260px;
}
.pill > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.remote { border-style: dashed; background: none; }
.pill.remote .o { color: var(--faint); font-weight: 500; }
.pill .sync { font-weight: 500; color: var(--faint); font-size: 10px; }
.pill.tag { border-color: var(--line); color: var(--muted); background: var(--band); font-weight: 500; clip-path: polygon(5px 0, 100% 0, 100% 100%, 5px 100%, 0 50%); padding-left: 9px; border-left: 0; }
.pill.head { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.pill.head .sync { color: inherit; opacity: .75; }
.pill.extra { border-color: var(--line); color: var(--faint); background: none; font-weight: 500; }

/* year rail */
.rail { position: relative; border-left: 1px solid var(--line-soft); background: var(--side); cursor: pointer; touch-action: none; }
#railc { position: absolute; inset: 0; }

/* ---------- inspector ---------- */
.inspect { width: 360px; border-left: 1px solid var(--line); background: var(--panel); overflow: auto; display: flex; flex-direction: column; }
.inspect[hidden] { display: none !important; }
.ins-top { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 0 16px; }
.ins-top .lbl { font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.ins-body { padding: 6px 16px 20px; display: flex; flex-direction: column; gap: 16px; }
.ins-subj { font-size: 15px; font-weight: 600; line-height: 1.35; margin: 0; text-wrap: pretty; overflow-wrap: anywhere; }
.ins-subj .tk { font-size: 13px; }
.links { display: flex; flex-wrap: wrap; gap: 6px; }
.links a { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; color: var(--fg); text-decoration: none; font-size: 12px; font-weight: 550; }
.links a:hover { border-color: var(--accent); color: var(--accent); }
.kv { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 7px 10px; font-size: 12.5px; margin: 0; }
.kv dt { color: var(--faint); font-size: 11.5px; }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.hash-line { display: flex; align-items: center; gap: 6px; }
.hash-line code { font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; }
.copy { border: 1px solid var(--line); background: none; border-radius: 5px; font-size: 11px; padding: 1px 7px; color: var(--muted); flex: none; }
.copy:hover { color: var(--fg); border-color: var(--faint); }
.blk h3 { margin: 0 0 6px; font-size: 10.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); display: flex; justify-content: space-between; }
.blk h3 span { letter-spacing: 0; text-transform: none; font-weight: 500; font-family: var(--font-mono); }
.clist { display: flex; flex-direction: column; border: 1px solid var(--line-soft); border-radius: 7px; overflow: hidden; }
.citem { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 8px; align-items: baseline; text-align: left; border: 0; background: none; padding: 6px 10px; border-top: 1px solid var(--line-soft); font-size: 12px; }
.citem:first-child { border-top: 0; }
.citem:hover { background: var(--hover); }
.citem code { font-family: var(--font-mono); font-size: 11px; color: var(--accent); }
.citem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg); }
.release { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 7px; background: var(--band); font-size: 12.5px; }
.release b { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }
.release .when { color: var(--faint); margin-left: auto; font-size: 11.5px; white-space: nowrap; }
.release.none { color: var(--muted); }
.pills-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.pills-wrap .pill { cursor: pointer; }
.showall { border: 0; background: none; color: var(--accent); font-size: 12px; padding: 4px 0 0; font-weight: 550; }
.note { color: var(--faint); font-size: 11.5px; }

.backdrop { display: none; }

/* ---------- responsive ---------- */
@container (max-width: 760px) {
  .cols, .row { grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 0 96px 0 !important; }
  .cols { grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 0 96px 0 44px !important; }
  .row > .au, .row > .hs, .cols > .c-au, .cols > .c-hs { padding: 0; visibility: hidden; }
  .dt .tm { display: none; }
}
@container (max-width: 460px) {
  .row, .cols { grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 0 0 0 !important; }
  .cols { grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 0 0 0 0 !important; }
  .row > .dt, .cols > .c-dt { padding: 0; visibility: hidden; }
}
@media (max-width: 1240px) {
  .inspect { position: absolute; right: 0; top: 0; bottom: 0; z-index: 6; box-shadow: var(--shadow); }
}
@media (max-width: 920px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .side { position: absolute; left: 0; top: 0; bottom: 0; width: min(300px, 86%); z-index: 7; box-shadow: var(--shadow); }
  .side:not(.open) { display: none; }
  .side-toggle { display: inline-flex; }
  .backdrop.open { display: block; position: absolute; inset: 0; z-index: 5; background: rgba(0,0,0,.25); }
  .tools { margin-left: 0; }
}
@media (max-width: 640px) {
  .list-wrap { grid-template-columns: minmax(0, 1fr) 30px; }
  .cols { grid-template-columns: var(--gw, 60px) minmax(0, 1fr) 0 0 0 30px !important; }
  .inspect { top: auto; left: 0; width: auto; max-height: 72%; border-left: 0; border-top: 1px solid var(--line); border-radius: 12px 12px 0 0; }
  .search input { width: 120px; }
  .stats { display: none; }
}
@media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="app">
  <header class="top">
    <div class="repo">
      <h1 id="repoName"></h1>
      <div class="stats" id="stats"></div>
    </div>
    <div class="tools">
      <button class="toggle side-toggle" id="sideToggle" aria-pressed="false" aria-controls="side">Branches</button>
      <div class="seg" role="group" aria-label="Which commits to show" id="scopeSeg">
        <button data-scope="all" aria-pressed="true" title="Every commit reachable from any branch or tag">All refs</button>
        <button data-scope="local" aria-pressed="false" title="Commits reachable from local branches">Local</button>
        <button data-scope="head" aria-pressed="false" title="Commits reachable from the checked-out branch">HEAD</button>
      </div>
      <div id="isoSlot"></div>
      <button class="toggle" id="tagToggle" aria-pressed="true"><span class="dot"></span>Tags</button>
      <div class="search" role="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        <input id="q" type="search" placeholder="Message, author, hash" aria-label="Search commits" autocomplete="off" spellcheck="false">
        <span class="count mono" id="qcount"></span>
        <button class="icon-btn" id="qprev" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 7.5L6 4l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" id="qnext" title="Next match (Enter)" aria-label="Next match" disabled><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </header>

  <div class="frame" id="frame">
    <aside class="side" id="side" aria-label="Branches and tags">
      <div class="side-head"><input id="refq" type="search" placeholder="Filter branches and tags" aria-label="Filter branches and tags" autocomplete="off" spellcheck="false"></div>
      <nav class="tree" id="tree"></nav>
    </aside>
    <div class="backdrop" id="backdrop"></div>

    <section class="graph" aria-label="Commit graph">
      <div class="cols" id="cols"><div>Graph</div><div>Description</div><div class="c-au">Author</div><div class="c-dt">Date</div><div class="c-hs">Commit</div><div></div></div>
      <div class="list-wrap" id="listWrap">
        <div class="scroller" id="scroller" tabindex="0" aria-label="Commits, newest first. Use arrow keys to move the selection.">
          <div class="spacer" id="spacer"><div class="rows" id="rows"></div></div>
        </div>
        <canvas id="lanes" aria-hidden="true"></canvas>
        <div class="rail" id="rail" title="Jump through history"><canvas id="railc" aria-hidden="true"></canvas></div>
      </div>
    </section>

    <aside class="inspect" id="inspect" aria-label="Commit details" hidden></aside>
  </div>
</div>

<script type="application/json" id="graph-data">/*__DATA__*/</script>
<script>
(() => {
'use strict';
const D = JSON.parse(document.getElementById('graph-data').textContent);
const C = D.commits, N = C.length, AUTH = D.authors;
const RH = 26, LW = 12, GP = 10, NCOL = 8;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = (n) => n.toLocaleString('en-US');
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };

/* ---------- static indexes ---------- */
const children = Array.from({ length: N }, () => []);
let merges = 0;
for (let i = 0; i < N; i++) {
  const ps = C[i][1];
  if (ps.length > 1) merges++;
  for (const p of ps) if (p >= 0) children[p].push(i);
}
const refsAt = new Map();
const refs = { local: [], remote: [], tag: [] };
for (const [t, n, i] of D.refs) {
  let o = refsAt.get(i);
  if (!o) refsAt.set(i, o = { local: [], remote: [], tag: [] });
  o[t].push(n);
  refs[t].push({ t, n, i });

  inspect.hidden = false;
  inspect.scrollTop = 0;
  $('insClose').onclick = closeInspector;
  $('copyHash').onclick = (e) => {
    const btn = e.currentTarget;
    const done = () => { btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy'; }, 1400); };
    try {
      navigator.clipboard.writeText(cm[0]).then(done, () => selectText($('fullHash')));
    } catch (err) { selectText($('fullHash')); }
  };
  const sa = $('showAllBr');
  if (sa) sa.onclick = () => { $('contBranches').innerHTML = ct.branches.map((b) => branchChip(b)).join(''); sa.remove(); };
  syncBackdrop();
}
function branchChip(name) {
  const isRemote = refs.remote.some((r) => r.n === name) && !refs.local.some((r) => r.n === name);
  return pillHtml(isRemote ? { k: 'remote', n: name } : { k: 'local', n: name, head: name === D.head }, null).replace('<span class="pill', `<span data-branch="${esc(name)}" role="button" tabindex="0" class="pill`);
}
function selectText(el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function closeInspector() { inspect.hidden = true; syncBackdrop(); scroller.focus({ preventScroll: true }); }

inspect.addEventListener('click', (e) => {
  const go = e.target.closest('[data-go]');
  if (go) { select(+go.dataset.go, { scroll: true, ensure: true }); return; }
  const br = e.target.closest('[data-branch]');
  if (br) jumpToBranch(br.dataset.branch);
});
inspect.addEventListener('keydown', (e) => {
  const br = e.target.closest('[data-branch]');
  if (br && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); jumpToBranch(br.dataset.branch); }
});
function jumpToBranch(name) {
  const r = refs.local.find((x) => x.n === name) || refs.remote.find((x) => x.n === name);
  if (r) select(r.i, { scroll: true, center: true, ensure: true });
}

rowsEl.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (!row) return;
  select(rowCommit[+row.dataset.r]);
  scroller.focus({ preventScroll: true });
});

/* ---------- keyboard ---------- */
scroller.addEventListener('keydown', (e) => {
  const r = rowOf[selected];
  let to = null;
  if (e.key === 'ArrowDown' || e.key === 'j') to = Math.min(nRows - 1, (r < 0 ? -1 : r) + 1);
  else if (e.key === 'ArrowUp' || e.key === 'k') to = Math.max(0, (r < 0 ? 1 : r) - 1);
  else if (e.key === 'PageDown') to = Math.min(nRows - 1, Math.max(0, r) + Math.floor(scroller.clientHeight / RH));
  else if (e.key === 'PageUp') to = Math.max(0, r - Math.floor(scroller.clientHeight / RH));
  else if (e.key === 'Home') to = 0;
  else if (e.key === 'End') to = nRows - 1;
  else if (e.key === 'Enter' && r >= 0) { openInspector(selected); return; }
  if (to !== null) { e.preventDefault(); select(rowCommit[to], { scroll: true, open: !inspect.hidden }); }
});
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('q').focus(); $('q').select(); }
  else if (e.key === 'Escape') {
    if ($('side').classList.contains('open')) toggleSide(false);
    else if (!inspect.hidden) closeInspector();
    else if (document.activeElement === $('q') && $('q').value) { $('q').value = ''; runSearch(); }
  }
});

/* ---------- search ---------- */
let lowerSubj = null, lowerAuth = null;
function runSearch() {
  query = $('q').value.trim();
  hitRows = new Uint8Array(nRows); hits = []; hitPos = -1;
  if (query.length >= 2) {
    if (!lowerSubj) { lowerSubj = C.map((c) => c[4].toLowerCase()); lowerAuth = AUTH.map((a) => a.toLowerCase()); }
    const q = query.toLowerCase(), isHex = /^[0-9a-f]{4,40}$/.test(q);
    for (let r = 0; r < nRows; r++) {
      const c = rowCommit[r];
      if (lowerSubj[c].includes(q) || lowerAuth[C[c][2]].includes(q) || (isHex && C[c][0].startsWith(q))) { hitRows[r] = 1; hits.push(r); }
    }
  }
  updateCount();
  if (hits.length) {
    const top = Math.floor(scroller.scrollTop / RH);
    hitPos = hits.findIndex((r) => r >= top);
    if (hitPos < 0) hitPos = 0;
    goHit(0);
  }
  schedule(true);
}
function updateCount() {
  $('qcount').textContent = query.length < 2 ? '' : hits.length ? `${fmtN(hitPos + 1)}/${fmtN(hits.length)}` : 'none';
  $('qprev').disabled = $('qnext').disabled = !hits.length;
}
function goHit(step) {
  if (!hits.length) return;
  hitPos = (hitPos + step + hits.length) % hits.length;
  const r = hits[hitPos];
  select(rowCommit[r], { scroll: true, center: true, open: !inspect.hidden || wideEnough() });
  updateCount();
}
let qTimer;
$('q').addEventListener('input', () => { clearTimeout(qTimer); qTimer = setTimeout(runSearch, 160); });
$('q').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); clearTimeout(qTimer); if (query !== $('q').value.trim()) runSearch(); else goHit(e.shiftKey ? -1 : 1); }
});
$('qnext').onclick = () => goHit(1);
$('qprev').onclick = () => goHit(-1);

/* ---------- scope controls ---------- */
function setScope(s) {
  scope = s;
  document.querySelectorAll('#scopeSeg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.scope === s.kind)));
  $('isoSlot').innerHTML = s.kind === 'ref' ? `<span class="iso-chip" title="Showing only commits reachable from ${esc(s.name)}"><span>Only ${esc(s.name)}</span><button id="isoClear" aria-label="Show all refs again">×</button></span>` : '';
  if (s.kind === 'ref') $('isoClear').onclick = () => setScope({ kind: 'all' });
  const keep = selected;
  layout();
  computeYears();
  gw = 0;
  if (query) runSearch(); else { hitRows = new Uint8Array(nRows); hits = []; }
  const r = rowOf[keep];
  if (r >= 0) scrollToRow(r, true); else scroller.scrollTop = 0;
  renderStats();
  schedule(true);
}
$('scopeSeg').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) setScope({ kind: b.dataset.scope }); });
$('tagToggle').setAttribute('aria-pressed', String(showTags));
$('tagToggle').onclick = () => {
  showTags = !showTags;
  store.set('gg.tags', showTags ? '1' : '0');
  $('tagToggle').setAttribute('aria-pressed', String(showTags));
  schedule(true);
  if (!inspect.hidden) openInspector(selected);
};

/* ---------- sidebar tree ---------- */
const tree = $('tree');
const openState = (() => { try { return JSON.parse(store.get('gg.open') || '{}'); } catch (e) { return {}; } })();
const isOpen = (k, dflt) => (k in openState ? openState[k] : dflt);
function verKey(f) { const m = f.match(/(\d+)\.(\d+)/); return m ? +m[1] * 1000 + +m[2] : -1; }
function buildGroups(items, kind) {
  const root = [], folders = new Map();
  for (const it of items) {
    let name = it.n, folder = '';
    if (kind === 'remote') name = name.replace(/^origin\//, '');
    if (kind === 'tag') { const m = name.match(/^v?(\d+)\.(\d+)/); folder = m ? `v${m[1]}.${m[2]}` : 'other'; }
    else if (name.includes('/')) folder = name.slice(0, name.indexOf('/'));
    const entry = { ...it, label: kind === 'tag' || !folder ? name : name.slice(folder.length + 1) };
    if (folder) { if (!folders.has(folder)) folders.set(folder, []); folders.get(folder).push(entry); } else root.push(entry);
  }
  const byDate = (a, b) => C[b.i][3] - C[a.i][3];
  root.sort(byDate);
  for (const v of folders.values()) v.sort(byDate);
  const fl = [...folders.entries()];
  if (kind === 'tag') fl.sort((a, b) => verKey(b[0]) - verKey(a[0]));
  else fl.sort((a, b) => C[b[1][0].i][3] - C[a[1][0].i][3]);
  return { root, folders: fl };
}
const ICON = {
  local: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><circle cx="4" cy="3.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="4" cy="12.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="12" cy="5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 5.3v5.4M12 6.8c0 3-8 2.2-8 3.9" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>',
  remote: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 12.5h7.2a3 3 0 0 0 .3-6 4 4 0 0 0-7.7-.9A3.5 3.5 0 0 0 4.5 12.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  tag: '<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h5.5l6.5 6.5-5 5-6.5-6.5V2.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="5" cy="5.5" r="1" fill="currentColor"/></svg>',
};
const CHEV = '<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 2l3 3-3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const groups = { local: buildGroups(refs.local, 'local'), remote: buildGroups(refs.remote, 'remote'), tag: buildGroups(refs.tag, 'tag') };
const SECTIONS = [['local', 'Local branches', true], ['remote', 'Remote · origin', false], ['tag', 'Tags', false]];

function refRowHtml(it, kind, inFold) {
  const cur = kind === 'local' && it.n === D.head;
  return `<div class="refrow${inFold ? ' in-fold' : ''}${cur ? ' cur' : ''}"><button class="ref" data-i="${it.i}" title="${esc(it.n)} · ${esc(C[it.i][4])}">${ICON[kind]}<span class="nm">${esc(it.label)}</span><span class="age">${ago(C[it.i][3])}</span></button><button class="iso" data-iso="${esc(it.n)}" data-i="${it.i}" title="Show only commits reachable from ${esc(it.n)}">ONLY</button></div>`;
}
function renderTree() {
  const f = $('refq').value.trim().toLowerCase();
  let html = '';
  for (const [kind, title, dOpen] of SECTIONS) {
    const g = groups[kind];
    const total = refs[kind].length;
    if (f) {
      const matches = refs[kind].filter((it) => it.n.toLowerCase().includes(f)).sort((a, b) => C[b.i][3] - C[a.i][3]);
      html += `<div class="sec"><div class="sec-h" aria-expanded="true">${title}<span class="n">${matches.length}</span></div>`;
      html += matches.slice(0, 200).map((it) => refRowHtml({ ...it, label: it.n }, kind, false)).join('');
      if (matches.length > 200) html += `<div class="more">${matches.length - 200} more, refine the filter</div>`;
      html += '</div>';
      continue;
    }
    const so = isOpen('s:' + kind, dOpen);
    html += `<div class="sec"><button class="sec-h" data-tog="s:${kind}" aria-expanded="${so}">${CHEV}${title}<span class="n">${fmtN(total)}</span></button>`;
    if (so) {
      for (const [folder, items] of g.folders) {
        const fo = isOpen(`f:${kind}:${folder}`, false);
        html += `<button class="fold-h" data-tog="f:${kind}:${folder}" aria-expanded="${fo}">${CHEV}${esc(folder)}${kind === 'tag' ? '' : '/'}<span class="n">${items.length}</span></button>`;
        if (fo) html += items.map((it) => refRowHtml(it, kind, true)).join('');
      }
      html += g.root.map((it) => refRowHtml(it, kind, false)).join('');
    }
    html += '</div>';
  }
  tree.innerHTML = html;
}
tree.addEventListener('click', (e) => {
  const tog = e.target.closest('[data-tog]');
  if (tog) { const k = tog.dataset.tog; openState[k] = tog.getAttribute('aria-expanded') !== 'true'; store.set('gg.open', JSON.stringify(openState)); renderTree(); return; }
  const iso = e.target.closest('[data-iso]');
  if (iso) { const i = +iso.dataset.i; selected = i; setScope({ kind: 'ref', name: iso.dataset.iso, i }); select(i, { scroll: true, center: true, open: wideEnough() }); toggleSide(false); return; }
  const ref = e.target.closest('.ref');
  if (ref) { select(+ref.dataset.i, { scroll: true, center: true, ensure: true }); toggleSide(false); }
});
let rTimer;
$('refq').addEventListener('input', () => { clearTimeout(rTimer); rTimer = setTimeout(renderTree, 120); });

/* ---------- small-screen drawers ---------- */
function toggleSide(open) {
  $('side').classList.toggle('open', open);
  $('sideToggle').setAttribute('aria-pressed', String(open));
  syncBackdrop();
}
function syncBackdrop() {
  const sideOpen = $('side').classList.contains('open') && window.matchMedia('(max-width: 920px)').matches;
  $('backdrop').classList.toggle('open', sideOpen);
}
$('sideToggle').onclick = () => toggleSide(!$('side').classList.contains('open'));
$('backdrop').onclick = () => toggleSide(false);

/* ---------- header stats ---------- */
function renderStats() {
  const shown = scope.kind === 'all' ? '' : `<span><b>${fmtN(nRows)}</b> shown</span>`;
  $('stats').innerHTML = `${shown}<span><b>${fmtN(N)}</b> commits</span><span><b>${fmtN(merges)}</b> merges</span><span><b>${AUTH.length}</b> authors</span>` +
    `<span><b>${refs.local.length}</b> local · <b>${refs.remote.length}</b> remote · <b>${fmtN(refs.tag.length)}</b> tags</span>` +
    `<span title="Data is a snapshot of the local clone">since ${fmtDate(firstTs)} · snapshot ${fmtDate(D.generated)}</span>`;
}

/* ---------- boot ---------- */
scroller.addEventListener('scroll', () => schedule(false), { passive: true });
new ResizeObserver(() => { lastR0 = -1; schedule(true); }).observe(listWrap);
const onTheme = () => { readTheme(); schedule(true); };
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', onTheme);
new MutationObserver(onTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => schedule(true));

$('repoName').innerHTML = (D.owner ? `<span>${esc(D.owner)} /</span> ` : '') + esc(D.repo);
if ((D.tickets || []).length) $('q').placeholder = `Message, author, hash, ${D.tickets[0]}-…`;

layout();
computeYears();
renderStats();
renderTree();
if (wideEnough()) openInspector(selected);
render(true);
})();
</script>
